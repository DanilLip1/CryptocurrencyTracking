services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "cryptocurrency"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "1111"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cryptocurrency" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
